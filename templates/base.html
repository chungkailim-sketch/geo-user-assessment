<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CBGA GEO Readiness Assessment{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/rf-favicon.svg?v={{ asset_v }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_v }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="CBGA GEO Readiness Assessment 首页">
      <img class="brand-logo" src="/static/img/rf-geo-logo.png?v={{ asset_v }}" alt="rf. GEO" width="92" height="31">
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-name">CBGA GEO Readiness Assessment</span>
    </a>
    <button type="button" class="glossary-toggle" data-glossary="" aria-controls="glossary" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5v-15zM5 19.5A1.5 1.5 0 0 0 6.5 21H19M9 7h6M9 10.5h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>术语表</span>
    </button>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    罗德亚洲AI可见度与GEO优化咨询。欲了解更多，请点击<a href="https://www.ruderfinnasia.com/zh/products/ai-visibility-geo-advisory" target="_blank" rel="noopener noreferrer">这里</a>
  </footer>
  {% include "_glossary.html" %}
  <script src="/static/js/glossary.js?v={{ asset_v }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
